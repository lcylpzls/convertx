name: 功能建议
description: 提出新的功能或改进方向
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 当前痛点是什么
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 转换 API 形态、选项或示例代码
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围确认
      description: 是否在项目范围内(非目标:序列化/ORM/表达式引擎/深拷贝独立API/代码生成CLI/跨语言绑定)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 其他可行思路(可选)
